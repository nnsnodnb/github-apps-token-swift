name: actionlint

on:
  pull_request:
    paths:
      - ".github/workflows/*.yml"

jobs:
  actionlint:
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: reviewdog/action-actionlint@v1.81.1
        with:
          reporter: github-pr-review
          level: warning
